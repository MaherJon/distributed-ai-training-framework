name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Byte-compile Python sources
        run: python -m compileall -q python build.py tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check web assets syntax
        run: node --check python/mahe/webui/app.js

  cpp-tests:
    name: cpp-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 的 arm64 镜像在当前账户下已不可用（The configuration ... is not supported）
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress
      - name: Configure MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy pybind11
      - name: Build core and run C++ tests
        run: python build.py --test
      - name: Import smoke test
        shell: bash
        run: |
          PYTHONPATH=python python -c "import mahe; assert mahe.HAS_CORE; print(mahe.mahe_core.kernel_impl())"
